<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD. SABBIR RAHMAN AKASH | Engineer & Strategist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#040405',
              surface: '#0D0D0F',
              'surface-light': '#141417',
              primary: '#00A3FF',
              'primary-dark': '#0082CC',
              secondary: '#FFC700',
              'text-primary': '#F8FAFC',
              'text-secondary': '#94A3B8',
              'text-muted': '#64748B',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Playfair Display', 'serif'],
              corporate: ['Outfit', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #040405;
        color: #F8FAFC;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        line-height: 1.6;
      }
      
      /* Professional Executive Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #040405;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272A;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00A3FF;
      }

      .font-display { font-family: 'Playfair Display', serif; }
      .font-corporate { font-family: 'Outfit', sans-serif; }

      /* Executive Glassmorphism */
      .glass {
        background: rgba(13, 13, 15, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Refined Content Styles */
      .prose h2 { margin-top: 2em; margin-bottom: 0.75em; font-size: 1.85rem; font-weight: 700; color: #F8FAFC; letter-spacing: -0.01em; font-family: 'Playfair Display', serif; }
      .prose h3 { margin-top: 1.5em; margin-bottom: 0.5em; font-size: 1.4rem; font-weight: 600; color: #F8FAFC; font-family: 'Playfair Display', serif; }
      .prose p { margin-bottom: 1.5em; line-height: 1.8; color: #94A3B8; font-size: 1.05rem; }
      .prose a { color: #00A3FF; text-decoration: none; font-weight: 500; transition: color 0.2s; border-bottom: 1px solid rgba(0, 163, 255, 0.15); }
      .prose a:hover { color: #FFFFFF; border-bottom-color: #00A3FF; }
      
      .glow-hover:hover {
        box-shadow: 0 0 40px rgba(0, 163, 255, 0.08);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
